name: Backend CI/CD

# WHEN does this run?
# - On every push to main (triggers deploy)
# - On every pull request to main (triggers CI only, no deploy)
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'        # Only run if backend files changed
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: CI — runs on EVERY push and PR
  # ─────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest   # GitHub spins up a free Linux VM for you

    steps:
      # Step 1: Download your repo code into the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js (matches your dev environment)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-path: backend/package-lock.json

      # Step 3: Install dependencies (like npm install, but faster in CI)
      - name: Install dependencies
        working-directory: backend
        run: npm ci   # "ci" is stricter than "install" — uses exact lockfile versions

      # Step 4: Run linter (catches code style issues before deploy)
      # We added an "lint" script to package.json for this
      - name: Lint
        working-directory: backend
        run: npm run lint --if-present   # --if-present means "skip if script doesn't exist"

      # Step 5: Run tests (we'll add a basic test below)
      - name: Test
        working-directory: backend
        run: npm test --if-present
        env:
          # Tests need env vars too — these come from GitHub Secrets (not your .env file!)
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci

  # ─────────────────────────────────────────
  # JOB 2: Deploy — only runs on push to main
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: ci   # ← This means "only deploy if CI passed"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Railway CLI handles the deploy — it reads RAILWAY_TOKEN from secrets
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: backend
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
