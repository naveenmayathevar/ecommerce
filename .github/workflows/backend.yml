name: Backend CI/CD
 
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
 
jobs:
  # ─────────────────────────────────────────
  # JOB 1: CI — runs on EVERY push and PR
  # ─────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json  # ← FIXED (was cache-path)
 
      - name: Install dependencies
        working-directory: backend
        run: npm ci
 
      - name: Lint
        working-directory: backend
        run: npm run lint --if-present
 
      - name: Test
        working-directory: backend
        run: npm test --if-present
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci
 
  # ─────────────────────────────────────────
  # JOB 2: Deploy — uses Render deploy hook
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci   # Only deploy if CI passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
 
    steps:
      - name: Trigger Render Deploy
        # Render gives you a deploy hook URL — just call it with curl
        # No CLI needed! Render watches for this and deploys automatically
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"